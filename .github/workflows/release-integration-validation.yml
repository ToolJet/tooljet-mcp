name: Release integration generation
on:
  push:
    branches:
      - chore/code-mode-release-7
      - fix/branch-aware-ai-tools
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate client distributions
        run: |
          npm run build:skill-plugin
          npm run build:grok-plugin
          npm run build:copilot-plugin
          npm run build:cursor-plugin
          npm run build:gemini-extension
          npm run build:kiro-power
      - name: Build standalone MCP bundle
        run: npm run build:plugin
      - name: Export generated integration files
        if: always()
        run: tar -czf /tmp/mcp-generated.tar.gz bundle skill skills plugins
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-generated
          path: /tmp/mcp-generated.tar.gz
      - name: Run MCP regression tests
        run: npm test -- --maxWorkers=1 --no-file-parallelism
      - name: Check plugin packaging
        run: npm run check:plugin-package
