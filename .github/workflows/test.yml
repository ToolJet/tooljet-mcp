name: MCP tests and packaging
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Uses the pinned source snapshot; no ToolJet checkout or credentials required.
      - run: npm run build:skill-plugin
      - name: Rebuild the Grok distribution from the shared skill
        run: npm run build:grok-plugin
      - name: Build Copilot package from the shared skill
        run: npm run build:copilot-plugin
      - name: Verify generated Markdown is current
        run: git diff --exit-code -- skill skills plugins
      - name: Verify generated skill plugin has no untracked files
        run: test -z "$(git ls-files --others --exclude-standard -- plugins)"
      - name: Test Grok package boundaries
        run: node --test tests/grokPackage.test.mjs
      - name: Upload generated Grok package for review
        uses: actions/upload-artifact@v4
        with:
          name: tooljet-grok-${{ github.sha }}
          path: plugins/tooljet-grok/
          include-hidden-files: true
          if-no-files-found: error
      - name: Test Copilot package boundaries
        run: node --test tests/copilotPackage.test.mjs
      - name: Upload generated Copilot package for review
        uses: actions/upload-artifact@v4
        with:
          name: tooljet-copilot-${{ github.sha }}
          path: plugins/tooljet-copilot/
          if-no-files-found: error
      - run: npm test
      - name: Build shipped bundle and verify MCP initialization
        run: npm run build:plugin
      - name: Verify committed bundle is current
        run: git diff --exit-code -- bundle
      - name: Verify new bundle modules are committed
        run: test -z "$(git ls-files --others --exclude-standard -- bundle)"
      - name: Enforce directory file-size and file-count limits
        run: npm run check:plugin-package
      - name: Check published package contents
        run: npm pack --dry-run
