name: Publish Claude plugin distribution

# Publish only the artifact that passed the complete push-to-main test workflow.
on:
  workflow_run:
    workflows: [MCP tests and packaging]
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: claude-plugin-distribution
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    env:
      SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Download the tested package from that CI run
        uses: actions/download-artifact@v4
        with:
          name: tooljet-claude-${{ env.SOURCE_COMMIT }}
          path: plugins/tooljet-claude/
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Publish generated files to the distribution branch
        shell: bash
        run: |
          set -euo pipefail
          current_main=$(git ls-remote --heads origin refs/heads/main)
          if [ "${current_main%%$'\t'*}" != "$SOURCE_COMMIT" ]; then
            echo "Skipped superseded source commit $SOURCE_COMMIT; a newer main commit must pass CI." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          dist_branch='chore/claude-plugin-dist'
          publication_dir="$RUNNER_TEMP/tooljet-claude-distribution"
          existing_ref=$(git ls-remote --heads origin "refs/heads/$dist_branch")
          if [ -n "$existing_ref" ]; then
            git fetch origin "refs/heads/$dist_branch"
            git worktree add --detach "$publication_dir" FETCH_HEAD
          else
            git worktree add --detach "$publication_dir" "$SOURCE_COMMIT"
            git -C "$publication_dir" switch --orphan chore/claude-dist-build
          fi
          rsync -a --checksum --delete --exclude='.git' "$GITHUB_WORKSPACE/plugins/tooljet-claude/" "$publication_dir/"
          git -C "$publication_dir" config user.name 'github-actions[bot]'
          git -C "$publication_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$publication_dir" add --all
          if ! git -C "$publication_dir" diff --cached --quiet; then
            git -C "$publication_dir" commit -m "Build Claude plugin from $SOURCE_COMMIT"
            git -C "$publication_dir" push origin "HEAD:refs/heads/$dist_branch"
          fi
          dist_sha=$(git -C "$publication_dir" rev-parse HEAD)
          {
            echo '### Claude plugin distribution'
            echo "Source commit: $SOURCE_COMMIT"
            echo "Distribution branch: $dist_branch"
            echo "Distribution commit: $dist_sha"
            echo 'Existing Claude listing: change only the tracked branch; keep the repository and root plugin path unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"
