name: Secret scan

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The CLI is MIT-licensed; the organization-only license requirement belongs
      # to the action wrapper. Keep the same failing check without that dependency.
      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks

      - name: Scan committed history for secrets
        shell: bash
        # Push/PR: all reachable history. Manual: all fetched branches and tags.
        run: |
          set -euo pipefail
          scan_history=HEAD
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            scan_history=--all
          fi
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --log-opts="$scan_history" --redact=100 --no-banner --report-format=json --report-path="$RUNNER_TEMP/gitleaks-report.json"

      - name: Upload redacted secret scan diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-redacted-report
          path: ${{ runner.temp }}/gitleaks-report.json
          retention-days: 7
